<body>
    <script>

        $(document).ready(function () {
            window.search_producto = function () {
                console.log("Función cargada y ejecutada.");
                var texto = $("#txtcode").val().trim();
                if (texto === "") {
                    alert("Ingrese un código de producto");
                    return;
                }

                var url = "http://localhost:8086/api/producto/code/" + texto;

                $.ajax({
                    url: url,
                    method: "GET",
                    success: function (data) {
                        if (data.msg === "Ok" && data.data) {
                            console.log("Datos recibidos:", data.data);
                            procesarDatos(data.data);
                        } else {
                            alert("Producto no encontrado");
                        }
                    },
                    error: function () {
                        alert("Error al buscar producto");
                    }
                });
            };

            function procesarDatos(data) {
                if (!data) {
                    console.error("Error: data.data no existe o es undefined/null", data);
                    return;
                }

                if (typeof data === "string") {
                    data = JSON.parse(data);
                }

                if (Array.isArray(data)) {
                    data.forEach(item => actualizarCarrito(item));
                } else if (typeof data === "object") {
                    actualizarCarrito(data);
                } else {
                    console.error("Error: Tipo de datos no soportado", data);
                }
            }

            function actualizarTotales() {
                let subtotal = 0;

                $("#table tbody tr").each(function () {
                    let totalFila = parseFloat($(this).find("td:eq(3)").text().replace("$", "")) || 0;
                    subtotal += totalFila;
                });

                let iva = subtotal * 0.15;
                let total = subtotal + iva;

                $("#txtsubtotal").val(`$${subtotal.toFixed(2)}`);
                $("#txtiva").val(`$${iva.toFixed(2)}`);
                $("#txttotal").val(`$${total.toFixed(2)}`);
            }

           
            function actualizarCarrito(producto) {
                var detalleActual = $("#txtdetalle").val() || "";
                var nuevoDetalle = actualizar_detalle(detalleActual, producto);

                console.log("Nuevo detalle:", nuevoDetalle);

                $("#txtdetalle").val(nuevoDetalle);

                let tablaHTML = crear_tabla(nuevoDetalle);
                if (tablaHTML) {
                    $("#table tbody").html(tablaHTML);
                } else {
                    console.warn("La tabla está vacía, no se actualizaron los productos.");
                }

                actualizarTotales();  

                $("#txtcode").val("");
            }



            function actualizar_detalle(detalle, producto) {
                detalle = detalle || ""; // Si detalle es null/undefined, se inicializa como cadena vacía

                var productos = detalle.length > 0 ? detalle.slice(0, -1).split(":") : [];
                var productoEncontrado = false;
                var nuevaLista = [];

                productos.forEach(item => {
                    var datos = item.split(",");
                    if (datos[0] === producto.idProducto.toString()) {
                        datos[1] = (parseInt(datos[1]) + 1).toString();
                        productoEncontrado = true;
                    }
                    nuevaLista.push(datos.join(","));
                });

                if (!productoEncontrado) {
                    nuevaLista.push(`${producto.idProducto},1,${producto.precio},${producto.modelo}`);
                }

                return nuevaLista.length > 0 ? nuevaLista.join(":") + ":" : "";
            }


            function crear_tabla(detalle) {
                if (!detalle || detalle.length === 0) {
                    return "";  // Si no hay productos, no devuelve nada
                }

                let productos = detalle.slice(0, -1).split(":");
                let filas = "";

                productos.forEach(item => {
                    let datos = item.split(",");
                    filas += `
            <tr>
                <td>${datos[3]}</td> <!-- Modelo -->
                <td>${datos[1]}</td> <!-- Cantidad -->
                <td>$${parseFloat(datos[2]).toFixed(2)}</td> <!-- Precio Unitario -->
                <td>$${(parseFloat(datos[1]) * parseFloat(datos[2])).toFixed(2)}</td> <!-- Total -->
            </tr>
        `;
                });

                return filas;
            }


            $("#txtcode").keypress(function (event) {
                if (event.which == 13) {
                    search_producto();
                }
            });

            $("#btnBuscar").click(function () {
                search_producto();
            });
        });


    </script>

        <!-- Input para ingresar código del producto -->
        <div class="input-group mb-3">

        <!-- Tabla para mostrar productos agregados -->
        <div class="table-responsive">

        <!-- Campos para mostrar totales -->

            </div>
            <div class="col-md-4">

            <div class="col-md-4">
